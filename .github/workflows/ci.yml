name: Foundation checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: returnwise
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: returnwise_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnwise -d returnwise_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://returnwise:ci_only_not_a_real_secret@127.0.0.1:5432/returnwise_dev
      TEST_DATABASE_URL: postgresql://returnwise:ci_only_not_a_real_secret@127.0.0.1:5432/returnwise_test
      APP_BASE_URL: http://127.0.0.1:3000
      PAYPAL_ENV: sandbox
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ENABLED: "false"
      DEEPSEEK_API_KEY: ""
      PAYPAL_CLIENT_ID: ""
      PAYPAL_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create isolated test database
        run: node --input-type=module -e 'import pg from "pg"; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query("CREATE DATABASE returnwise_test"); await c.end();'
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:migrate:test
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npx vitest run --config vitest.integration.config.ts
      - run: npm run build
      - run: npm run test:e2e:install -- --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
